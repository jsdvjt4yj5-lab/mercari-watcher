name: Refresh command listener

on:
  schedule:
    # every 5 minutes — GitHub's practical minimum interval
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  listen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check for /refresh command
        env:
          ITEM_URL: ${{ secrets.ITEM_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KNOWN_END_TIME: ${{ secrets.KNOWN_END_TIME }}
        run: python refresh_listener.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "update state (refresh listener)"
          git pull --rebase origin main
          git push
